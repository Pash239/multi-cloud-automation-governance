name: Ansible syntax validation

on:
  pull_request:
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-syntax.yml'
  push:
    branches:
      - assessment-solution
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-syntax.yml'

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install ansible-core

      - name: Install required Ansible collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax-check playbooks
        working-directory: ansible
        run: |
          ansible-playbook --syntax-check playbooks/compliance-check.yml
          ansible-playbook --syntax-check playbooks/remediate-drift.yml
          ansible-playbook --syntax-check playbooks/patch-linux.yml
          ansible-playbook --syntax-check playbooks/update-containers.yml
          ansible-playbook --syntax-check playbooks/validate-health.yml
