---
- name: Define distribution-specific baseline values
  ansible.builtin.set_fact:
    baseline_audit_package: "{{ 'audit' if ansible_os_family == 'RedHat' else 'auditd' }}"
    baseline_chrony_service: "{{ 'chronyd' if ansible_os_family == 'RedHat' else 'chrony' }}"
    baseline_ssh_service: "{{ 'sshd' if ansible_os_family == 'RedHat' else 'ssh' }}"

- name: Install baseline operational and audit packages
  ansible.builtin.package:
    name:
      - "{{ baseline_audit_package }}"
      - chrony
    state: present

- name: Ensure audit service is enabled and running
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true

- name: Ensure time synchronization is enabled and running
  ansible.builtin.service:
    name: "{{ baseline_chrony_service }}"
    state: started
    enabled: true

- name: Disable direct root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin\s+'
    line: 'PermitRootLogin no'
    validate: '/usr/sbin/sshd -t -f %s'
    backup: true
  notify: Reload SSH service

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication\s+'
    line: 'PasswordAuthentication no'
    validate: '/usr/sbin/sshd -t -f %s'
    backup: true
  notify: Reload SSH service

- name: Apply approved kernel network hardening controls
  ansible.posix.sysctl:
    name: '{{ item.name }}'
    value: '{{ item.value }}'
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { name: 'net.ipv4.conf.all.accept_redirects', value: '0' }
    - { name: 'net.ipv4.conf.default.accept_redirects', value: '0' }
    - { name: 'net.ipv4.conf.all.send_redirects', value: '0' }
    - { name: 'net.ipv4.conf.default.send_redirects', value: '0' }
    - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
    - { name: 'net.ipv4.conf.default.rp_filter', value: '1' }
