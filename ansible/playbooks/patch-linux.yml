---
- name: Canary-first rolling Linux patching
  hosts: production
  become: true
  serial: 5
  max_fail_percentage: 0
  pre_tasks:
    - name: Verify minimum free space on root filesystem
      ansible.builtin.assert:
        that:
          - ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='size_available') | first | int > 2147483648
        fail_msg: "Less than 2 GiB free on root filesystem; stopping maintenance for this host"

  tasks:
    - name: Apply approved security updates on Red Hat family
      ansible.builtin.dnf:
        name: '*'
        state: latest
        security: true
      when: ansible_os_family == 'RedHat'
      register: patch_result

    - name: Apply available package updates on Debian family
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
      when: ansible_os_family == 'Debian'
      register: patch_result_debian

    - name: Check whether reboot is required on Debian family
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: debian_reboot_required
      when: ansible_os_family == 'Debian'

    - name: Reboot Debian host when required
      ansible.builtin.reboot:
        reboot_timeout: 900
      when:
        - ansible_os_family == 'Debian'
        - debian_reboot_required.stat.exists | default(false)

  post_tasks:
    - name: Wait for Docker service to be available
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Validate Docker responds
      ansible.builtin.command: docker info
      changed_when: false
